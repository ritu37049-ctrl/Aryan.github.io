
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOID // CYBER PROFILES</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:monospace;
}

body{
    background:#050008;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* Cyber background */
body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
      linear-gradient(rgba(140,0,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(140,0,255,.05) 1px,transparent 1px);
    background-size:35px 35px;
    pointer-events:none;
    z-index:-2;
}

body:after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    background:#8b00ff;
    filter:blur(180px);
    opacity:.18;
    top:10%;
    left:50%;
    transform:translateX(-50%);
    z-index:-1;
}

/* NAVBAR */

nav{
    height:70px;
    padding:0 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #35104d;
    background:rgba(5,0,8,.75);
    backdrop-filter:blur(12px);
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    color:#b84cff;
    font-size:22px;
    font-weight:bold;
    letter-spacing:3px;
    text-shadow:0 0 15px #9d00ff;
}

nav button{
    background:none;
    border:1px solid #8b00ff;
    color:#d69aff;
    padding:9px 15px;
    border-radius:6px;
    cursor:pointer;
}

/* HERO */

.hero{
    min-height:75vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px 20px;
}

.status{
    color:#a94dff;
    font-size:13px;
    letter-spacing:3px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(42px,11vw,90px);
    letter-spacing:8px;
    text-shadow:
      0 0 10px #8b00ff,
      0 0 35px #6f00ff;
}

.hero p{
    color:#9d91a8;
    margin:20px auto 30px;
    max-width:550px;
    line-height:1.7;
}

.main-btn{
    border:1px solid #a100ff;
    background:#120019;
    color:#d98cff;
    padding:14px 28px;
    border-radius:5px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(150,0,255,.3);
    transition:.3s;
}

.main-btn:hover{
    background:#8b00ff;
    color:#fff;
    box-shadow:0 0 35px #8b00ff;
    transform:translateY(-3px);
}

/* SECTIONS */

.section{
    padding:60px 7%;
}

.title{
    text-align:center;
    margin-bottom:35px;
}

.title h2{
    color:#c66aff;
    font-size:28px;
    text-shadow:0 0 15px #8b00ff;
}

.title p{
    color:#756b7c;
    margin-top:8px;
}

/* PROFILE CREATOR */

.creator{
    max-width:650px;
    margin:auto;
    padding:30px;
    border:1px solid #40135c;
    border-radius:12px;
    background:rgba(20,0,30,.7);
    box-shadow:0 0 35px rgba(130,0,255,.12);
}

.input{
    width:100%;
    padding:13px;
    margin-bottom:15px;
    background:#09000d;
    border:1px solid #3d174e;
    color:white;
    border-radius:5px;
    outline:none;
}

.input:focus{
    border-color:#a100ff;
    box-shadow:0 0 12px rgba(161,0,255,.3);
}

textarea.input{
    height:100px;
    resize:none;
}

.file{
    display:none;
}

.file-label{
    display:block;
    padding:14px;
    border:1px dashed #7930a0;
    text-align:center;
    color:#bb70df;
    cursor:pointer;
    margin-bottom:20px;
    border-radius:5px;
}

.create{
    width:100%;
    padding:14px;
    background:#7500a8;
    border:0;
    color:#fff;
    cursor:pointer;
    border-radius:5px;
    font-weight:bold;
    transition:.3s;
}

.create:hover{
    background:#a100ff;
    box-shadow:0 0 25px #8b00ff;
}

/* PROFILES */

.profiles{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    padding:25px;
    background:rgba(15,0,22,.8);
    border:1px solid #35104d;
    border-radius:10px;
    text-align:center;
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#9b00ff;
    box-shadow:0 0 25px rgba(155,0,255,.25);
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #9b00ff;
    box-shadow:0 0 20px #7200a8;
    margin-bottom:15px;
}

.card h3{
    color:#d79aff;
}

.username{
    color:#7e6d89;
    font-size:13px;
    margin:5px 0 15px;
}

.bio{
    color:#aaa;
    font-size:14px;
    line-height:1.6;
}

.skills{
    margin-top:15px;
}

.skill{
    display:inline-block;
    border:1px solid #512064;
    color:#bb70df;
    padding:5px 8px;
    margin:3px;
    border-radius:4px;
    font-size:11px;
}

/* FOOTER */

footer{
    text-align:center;
    padding:30px;
    color:#55485c;
    border-top:1px solid #24102f;
    margin-top:40px;
}

/* MOBILE */

@media(max-width:600px){

    nav{
        padding:0 20px;
    }

    nav button{
        font-size:11px;
    }

    .hero h1{
        letter-spacing:4px;
    }

    .section{
        padding:45px 20px;
    }

    .creator{
        padding:20px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">VOID//NET</div>
    <button onclick="scrollToCreator()">CREATE PROFILE</button>
</nav>

<section class="hero">

    <div>

        <div class="status">
            ● SYSTEM ONLINE
        </div>

        <h1>ENTER THE VOID</h1>

        <p>
            Create your own cyber identity.
            Build a profile and enter the network.
        </p>

        <button class="main-btn" onclick="scrollToCreator()">
            [ CREATE YOUR PROFILE ]
        </button>

    </div>

</section>


<section class="section" id="creator">

    <div class="title">
        <h2>// CREATE IDENTITY</h2>
        <p>Build your personal profile</p>
    </div>

    <div class="creator">

        <input
            class="input"
            id="name"
            placeholder="ENTER NAME"
        >

        <input
            class="input"
            id="username"
            placeholder="ENTER USERNAME"
        >

        <textarea
            class="input"
            id="bio"
            placeholder="WRITE YOUR BIO..."
        ></textarea>

        <input
            class="input"
            id="skills"
            placeholder="SKILLS (example: HTML, Gaming, Editing)"
        >

        <label class="file-label" for="photo">
            📁 SELECT PROFILE IMAGE
        </label>

        <input
            class="file"
            type="file"
            id="photo"
            accept="image/*"
        >

        <button class="create" onclick="createProfile()">
            CREATE PROFILE
        </button>

    </div>

</section>


<section class="section">

    <div class="title">
        <h2>// NETWORK PROFILES</h2>
        <p>Profiles created on this device</p>
    </div>

    <div class="profiles" id="profiles">

    </div>

</section>


<footer>
    VOID//NET — CYBER PROFILE NETWORK
</footer>


<script>

function scrollToCreator(){

    document.getElementById("creator")
    .scrollIntoView({
        behavior:"smooth"
    });

}


/* Load saved profiles */

let savedProfiles =
    JSON.parse(localStorage.getItem("profiles")) || [];

displayProfiles();


function createProfile(){

    const name =
        document.getElementById("name").value.trim();

    const username =
        document.getElementById("username").value.trim();

    const bio =
        document.getElementById("bio").value.trim();

    const skills =
        document.getElementById("skills").value.trim();

    const file =
        document.getElementById("photo").files[0];


    if(!name || !username){

        alert("NAME aur USERNAME zaroor bharo.");

        return;
    }


    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            saveProfile(
                name,
                username,
                bio,
                skills,
                e.target.result
            );

        };

        reader.readAsDataURL(file);

    }else{

        saveProfile(
            name,
            username,
            bio,
            skills,
            ""
        );

    }

}


function saveProfile(
    name,
    username,
    bio,
    skills,
    image
){

    const profile = {

        name:name,

        username:username,

        bio:bio,

        skills:skills,

        image:image

    };


    savedProfiles.push(profile);

    localStorage.setItem(
        "profiles",
        JSON.stringify(savedProfiles)
    );


    document.getElementById("name").value="";
    document.getElementById("username").value="";
    document.getElementById("bio").value="";
    document.getElementById("skills").value="";
    document.getElementById("photo").value="";


    displayProfiles();

    alert("PROFILE CREATED ✓");

}


function displayProfiles(){

    const container =
        document.getElementById("profiles");

    container.innerHTML="";


    savedProfiles.forEach(function(profile){

        const card =
            document.createElement("div");

        card.className="card";


        const avatar =
            profile.image ||
            "https://via.placeholder.com/90/150020/ffffff?text=USER";


        let skillHTML="";


        if(profile.skills){

            profile.skills
            .split(",")
            .forEach(function(skill){

                skillHTML +=
                    `<span class="skill">
                    ${skill.trim()}
                    </span>`;

            });

        }


        card.innerHTML = `

            <img
                class="avatar"
                src="${avatar}"
            >

            <h3>${profile.name}</h3>

            <div class="username">
                @${profile.username}
            </div>

            <div class="bio">
                ${profile.bio || "No bio available."}
            </div>

            <div class="skills">
                ${skillHTML}
            </div>

        `;


        container.appendChild(card);

    });

}

</script>

</body>
</html>
