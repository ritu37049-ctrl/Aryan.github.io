

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOID//NET</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --main:#a000ff;
    --light:#d9aaff;
    --bg:#030006;
    --card:#0b0312;
    --border:#4b146b;
}

body{
    background:
    radial-gradient(circle at 20% 10%,#35005d 0,transparent 30%),
    radial-gradient(circle at 90% 90%,#19003a 0,transparent 35%),
    var(--bg);
    color:white;
    font-family:Orbitron,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
    linear-gradient(rgba(150,0,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(150,0,255,.06) 1px,transparent 1px);
    background-size:40px 40px;
}

.glow{
    position:fixed;
    width:250px;
    height:250px;
    border-radius:50%;
    background:#a000ff;
    filter:blur(120px);
    opacity:.16;
    pointer-events:none;
}

.g1{top:-100px;left:-100px}
.g2{bottom:-100px;right:-100px}

/* ================= HOME ================= */

#homePage{
    min-height:100vh;
}

.homeHeader{
    text-align:center;
    padding:70px 20px 30px;
}

.logo{
    font-size:clamp(45px,11vw,85px);
    font-weight:900;
    letter-spacing:8px;
    text-shadow:
    0 0 10px #a000ff,
    0 0 30px #a000ff,
    0 0 70px #7200ff;
}

.developed{
    margin-top:12px;
    color:#ad8bc0;
    font-size:11px;
    letter-spacing:4px;
}

.homeContent{
    max-width:800px;
    margin:auto;
    text-align:center;
    padding:30px 20px 80px;
}

.welcome{
    font-size:clamp(20px,5vw,36px);

}

.tagline{

    font-size:11px;
    letter-spacing:3px;
    margin-bottom:45px;
}

.createBtn{
    border:1px solid #a000ff;
    background:rgba(100,0,160,.12);
    color:white;
    border-radius:12px;
    padding:22px;
    width:100%;
    font-family:inherit;
    font-weight:700;

}

.createBtn:hover{
    transform:translateY(-5px);
    background:rgba(160,0,255,.2);
    box-shadow:0 0 35px rgba(160,0,255,.5);
}

/* ================= CREATE ================= */

#createPage{
    display:none;
    min-height:100vh;
    padding:30px 20px 70px;
}

.createBox{
    max-width:650px;

    background:rgba(8,2,14,.9);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;

}

.pageTitle{

    font-size:25px;

    text-shadow:0 0 20px #a000ff;
}

.field{
    margin-bottom:17px;
}

.field label{
    display:block;
    font-size:9px;
    letter-spacing:2px;
    color:#b997c8;
    margin-bottom:8px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    background:#07020c;
    border:1px solid #351345;
    color:white;
    padding:14px;
    border-radius:8px;
    outline:none;
    font-family:inherit;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{

    box-shadow:0 0 15px rgba(160,0,255,.3);
}

.photoPreview{
    width:120px;
    height:120px;
    border-radius:50%;

    align-items:center;
    justify-content:center;
    overflow:hidden;
    color:#72587c;
    font-size:9px;
    text-align:center;
    box-shadow:0 0 30px rgba(160,0,255,.4);
}

.photoPreview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.saveBtn{
    width:100%;
    padding:16px;
    border:0;
    border-radius:9px;
    background:linear-gradient(90deg,#7000ff,#b000ff);
    color:white;
    font-family:inherit;
    font-weight:800;
    letter-spacing:2px;
    cursor:pointer;
}

/* ================= SOCIAL PAGE ================= */

#socialPage{
    display:none;
    min-height:100vh;
    padding-bottom:80px;
}

/* TOP BAR */

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    height:65px;
    background:rgba(4,0,8,.9);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #32103f;

    align-items:center;

    padding:0 18px;
}

.brand{

    text-shadow:0 0 15px #a000ff;
}

.topIcon{

    border:0;
    color:white;

/* PROFILE HEADER */

.profileHeader{
    max-width:900px;
    margin:auto;
    padding:35px 20px 20px;
}

.profileTop{
    display:flex;
    gap:25px;
    align-items:center;
}

.avatar{
    width:105px;
    height:105px;
    border-radius:50%;
    border:2px solid #a000ff;
    overflow:hidden;
    flex-shrink:0;
    display:flex;
    justify-content:center;
    align-items:center;

}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profileInfo{
    flex:1;
}

.profileName{
    font-size:22px;
    font-weight:800;
}

.profileUsername{
    color:#a96ad0;
    font-size:10px;
    margin-top:7px;
}

.bio{
    color:#aa9aad;
    font-size:10px;
    line-height:1.7;
    margin-top:12px;
}

.stats{
    display:flex;
    gap:25px;

}

.stat{
    text-align:center;
    font-size:9px;

}

.stat strong{

}

.editProfile{

    border-radius:7px;

    cursor:pointer;
}

/* TABS */

.tabs{

    margin:20px auto 0;

}

.tab{

    border:0;

    font-family:inherit;

.tab.active{

/* POSTS */

}

.post{

    border-radius:15px;

}

.postHead{

.miniAvatar{

.miniAvatar img{

.postImage{

}

.postActions{

}

.action{

.action.liked{

}

.commentBox{
    display:flex;

}

.commentBox input{
    flex:1;
    background:#06020a;
    border:1px solid #32113c;
    color:white;
    border-radius:7px;
    padding:10px;
    font-family:inherit;
    font-size:9px;
}

.commentBox button{
    background:#8200c7;

    border-radius:7px;
    padding:0 13px;
    cursor:pointer;
}

/* ADD POST */

.addPost{
    max-width:650px;
    margin:25px auto;
    padding:0 15px;
}

.addBox{
    background:#09030e;
    border:1px solid #3c1548;
    border-radius:15px;
    padding:18px;
}

.addBox h3{
    font-size:12px;

}

.addBox textarea{
    width:100%;
    min-height:70px;
    background:#050108;
    border:1px solid #32113d;
    color:white;
    padding:12px;
    border-radius:8px;
    font-family:inherit;
    font-size:10px;
    resize:none;
    margin-bottom:10px;
}

.postBtn{
    width:100%;
    padding:12px;

    font-family:inherit;

    cursor:pointer;
}

/* SETTINGS */

.settings{
    display:none;
    max-width:650px;
    margin:30px auto;
    padding:0 20px;
}

.settingCard{
    background:#09030e;
    border:1px solid #35123f;
    border-radius:15px;
    padding:20px;
}

.settingBtn{
    width:100%;
    padding:14px;
    margin-bottom:10px;
    background:#0d0413;
    border:1px solid #3d1549;
    color:#cda9da;
    border-radius:8px;
    font-family:inherit;
    cursor:pointer;
}

.settingBtn:hover{
    border-color:#a000ff;
}

.danger{
    color:#ff6b8a;
}

/* BOTTOM NAV */

.bottomNav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:rgba(4,0,8,.94);
    backdrop-filter:blur(15px);
    border-top:1px solid #35103f;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.navBtn{
    background:none;
    border:0;
    color:#765c7e;
    font-size:20px;
    cursor:pointer;
}

.navBtn.active{
    color:#fff;
    text-shadow:0 0 15px #a000ff;
}

/* MOBILE */

@media(max-width:600px){

    .profileTop{
        gap:17px;
    }

    .avatar{
        width:85px;
        height:85px;
    }

    .profileName{
        font-size:17px;
    }

    .stats{
        gap:15px;
    }

    .logo{
        letter-spacing:4px;
    }
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div class="glow g1"></div>
<div class="glow g2"></div>


<!-- ==================================================

<script>

/* ==================================================
   VARIABLES
================================================== */

let selectedImage = "";


/* ==================================================
   PHOTO PREVIEW
================================================== */

document
.getElementById("photo")
.addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        selectedImage = e.target.result;

        document
        .getElementById("photoPreview")
        .innerHTML =
        `<img src="${selectedImage}">`;

    };

    reader.readAsDataURL(file);

});


/* ==================================================
   OPEN CREATE PAGE
================================================== */

function openCreate(){

    document
    .getElementById("homePage")
    .style.display="none";

    document
    .getElementById("socialPage")
    .style.display="none";

    document
    .getElementById("createPage")
    .style.display="block";

    loadProfileIntoForm();

    window.scrollTo(0,0);
}


/* ==================================================
   CREATE PROFILE
================================================== */

function createProfile(){

    const name =
    document.getElementById("name").value.trim();

    let username =
    document.getElementById("username").value.trim();

    const bio =
    document.getElementById("bio").value.trim();

    const skills =
    document.getElementById("skills").value
    .split(",")
    .map(x=>x.trim())
    .filter(x=>x);

    const instagram =
    document.getElementById("instagram").value.trim();

    const youtube =
    document.getElementById("youtube").value.trim();

    const discord =
    document.getElementById("discord").value.trim();

    const style =
    document.getElementById("style").value;


    if(!name || !username){

        alert("NAME aur USERNAME bharna zaroori hai.");

        return;
    }


    if(!username.startsWith("@")){
        username="@"+username;
    }


    const profile = {

        name:name,

        username:username,

        bio:bio,

        skills:skills,

        instagram:instagram,

        youtube:youtube,

        discord:discord,

        style:style,

        image:selectedImage

    };


    localStorage.setItem(
        "voidProfile",
        JSON.stringify(profile)
    );


    if(!localStorage.getItem("voidPosts")){
        localStorage.setItem(
            "voidPosts",
            JSON.stringify([])
        );
    }


    /* DIRECTLY SOCIAL PAGE */

    openSocial();

}


/* ==================================================
   OPEN SOCIAL PAGE
================================================== */

function openSocial(){

    document
    .getElementById("homePage")
    .style.display="none";

    document
    .getElementById("createPage")
    .style.display="none";

    document
    .getElementById("socialPage")
    .style.display="block";

    loadProfile();

    renderPosts();

    window.scrollTo(0,0);

}


/* ==================================================
   LOAD PROFILE
================================================== */

function loadProfile(){

    const saved =
    localStorage.getItem("voidProfile");

    if(!saved) return;

    const profile =
    JSON.parse(saved);


    document
    .getElementById("profileName")
    .textContent=profile.name;


    document
    .getElementById("profileUsername")
    .textContent=profile.username;


    document
    .getElementById("profileBio")
    .textContent=profile.bio || "No bio yet.";


    const avatar =
    document.getElementById("mainAvatar");


    if(profile.image){

        avatar.innerHTML=
        `<img src="${profile.image}">`;

    }else{

        avatar.innerHTML="◉";

    }


    updatePostCount();

}


/* ==================================================
   LOAD PROFILE INTO EDIT FORM
================================================== */

function loadProfileIntoForm(){

    const saved =
    localStorage.getItem("voidProfile");

    if(!saved) return;

    const p=JSON.parse(saved);


    document.getElementById("name").value=
    p.name || "";

    document.getElementById("username").value=
    p.username || "";

    document.getElementById("bio").value=
    p.bio || "";

    document.getElementById("skills").value=
    (p.skills || []).join(", ");

    document.getElementById("instagram").value=
    p.instagram || "";

    document.getElementById("youtube").value=
    p.youtube || "";

    document.getElementById("discord").value=
    p.discord || "";

    document.getElementById("style").value=
    p.style || "purple";


    if(p.image){

        selectedImage=p.image;

        document
        .getElementById("photoPreview")
        .innerHTML=
        `<img src="${p.image}">`;

    }

}


/* ==================================================
   PROFILE PAGE
================================================== */

function showProfile(){

    document
    .getElementById("settings")
    .style.display="none";

    document
    .querySelector(".addPost")
    .style.display="block";

    document
    .getElementById("posts")
    .style.display="block";

    loadProfile();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ==================================================
   SETTINGS
================================================== */

function openSettings(){

    document
    .querySelector(".addPost")
    .style.display="none";

    document
    .getElementById("posts")
    .style.display="none";

    document
    .getElementById("settings")
    .style.display="block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ==================================================
   SHOW POSTS
================================================== */

function showPosts(){

    document
    .getElementById("settings")
    .style.display="none";

    document
    .querySelector(".addPost")
    .style.display="block";

    document
    .getElementById("posts")
    .style.display="block";

    renderPosts();

}


/* ==================================================
   CREATE POST
================================================== */

function createPost(){

    const file =
    document.getElementById("postPhoto").files[0];

    const caption =
    document.getElementById("postCaption").value.trim();


    if(!file){

        alert("Post ke liye image select karo.");

        return;
    }


    const reader=new FileReader();


    reader.onload=function(e){

        const posts=
        JSON.parse(
            localStorage.getItem("voidPosts") || "[]"
        );


        const post={

            id:Date.now(),

            image:e.target.result,

            caption:caption,

            likes:0,

            liked:false,

            comments:[]

        };


        posts.unshift(post);


        localStorage.setItem(
            "voidPosts",
            JSON.stringify(posts)
        );


        document
        .getElementById("postPhoto")
        .value="";


        document
        .getElementById("postCaption")
        .value="";


        renderPosts();

        updatePostCount();

    };


    reader.readAsDataURL(file);

}


/* ==================================================
   RENDER POSTS
================================================== */

function renderPosts(){

    const container=
    document.getElementById("posts");

    const posts=
    JSON.parse(
        localStorage.getItem("voidPosts") || "[]"
    );


    container.innerHTML="";


    if(posts.length===0){

        container.innerHTML=`

        <div class="emptyPost"
        style="
        text-align:center;
        padding:50px 10px;
        color:#765d7e;
        font-size:10px;
        ">

        NO POSTS YET<br><br>

        CREATE YOUR FIRST VOID//NET POST ⚡

        </div>

        `;

        return;

    }


    const profile=
    JSON.parse(
        localStorage.getItem("voidProfile")
    );


    posts.forEach(post=>{

        const comments=
        (post.comments || [])
        .map(comment=>`

            <div class="comment">

                <b>${escapeHTML(comment.user)}</b>
                ${escapeHTML(comment.text)}

            </div>

        `)
        .join("");


        const div=
        document.createElement("div");

        div.className="post";


        div.innerHTML=`

        <div class="postHead">

            <div class="miniAvatar">

                ${
                    profile.image
                    ? `<img src="${profile.image}">`
                    : `◉`
                }

            </div>

            <div class="postUser">

                ${escapeHTML(profile.name)}

                <small>
                    ${escapeHTML(profile.username)}
                </small>

            </div>

        </div>


        <img
            class="postImage"
            src="${post.image}">


        <div class="postActions">

            <button
                class="action ${post.liked ? "liked":""}"
                onclick="likePost(${post.id})">

                ${post.liked ? "♥":"♡"}

            </button>


            <button
                class="action"
                onclick="focusComment(${post.id})">

                ♡̸

            </button>


            <button
                class="action"
                onclick="sharePost(${post.id})">

                ↗

            </button>

        </div>


        <div class="caption">

            <b>${post.likes} likes</b>

            <br>

            ${
                post.caption
                ? escapeHTML(post.caption)
                : ""
            }

        </div>


        <div class="comments">

            ${comments}


            <div class="commentBox">

                <input
                    id="comment-${post.id}"
                    placeholder="Add a comment...">

                <button
                    onclick="addComment(${post.id})">

                    SEND

                </button>

            </div>

        </div>

        `;


        container.appendChild(div);

    });

}


/* ==================================================
   LIKE
================================================== */

function likePost(id){

    const posts=
    JSON.parse(
        localStorage.getItem("voidPosts") || "[]"
    );


    const post=
    posts.find(p=>p.id===id);


    if(!post) return;


    if(post.liked){

        post.likes--;

    }else{

        post.likes++;

    }


    post.liked=!post.liked;


    localStorage.setItem(
        "voidPosts",
        JSON.stringify(posts)
    );


    renderPosts();

}


/* ==================================================
   COMMENT
================================================== */

function addComment(id){

    const input=
    document.getElementById(
        "comment-"+id
    );


    const text=input.value.trim();


    if(!text) return;


    const profile=
    JSON.parse(
        localStorage.getItem("voidProfile")
    );


    const posts=
    JSON.parse(
        localStorage.getItem("voidPosts") || "[]"
    );


    const post=
    posts.find(p=>p.id===id);


    if(!post.comments){
        post.comments=[];
    }


    post.comments.push({

        user:profile.username,

        text:text

    });


    localStorage.setItem(
        "voidPosts",
        JSON.stringify(posts)
    );


    renderPosts();

}


/* ==================================================
   COMMENT FOCUS
================================================== */

function focusComment(id){

    setTimeout(()=>{

        const input=
        document.getElementById(
            "comment-"+id
        );

        if(input){

            input.focus();

        }

    },100);

}


/* ==================================================
   SHARE
================================================== */

function sharePost(id){

    if(navigator.share){

        navigator.share({

            title:"VOID//NET",

            text:"Check out this VOID//NET post."

        });

    }else{

        alert("Post sharing browser me available nahi hai.");

    }

}


/* ==================================================
   UPDATE POST COUNT
================================================== */

function updatePostCount(){

    const posts=
    JSON.parse(
        localStorage.getItem("voidPosts") || "[]"
    );

    document
    .getElementById("postCount")
    .textContent=posts.length;

}


/* ==================================================
   CLEAR POSTS
================================================== */

function clearPosts(){

    const ok=
    confirm(
        "Kya tum apne saare posts delete karna chahte ho?"
    );


    if(!ok) return;


    localStorage.setItem(
        "voidPosts",
        JSON.stringify([])
    );


    renderPosts();

    updatePostCount();

}


/* ==================================================
   DELETE PROFILE
================================================== */

function deleteProfile(){

    const ok=
    confirm(
        "Profile aur posts permanently delete karne hain?"
    );


    if(!ok) return;


    localStorage.removeItem("voidProfile");

    localStorage.removeItem("voidPosts");


    document
    .getElementById("socialPage")
    .style.display="none";

    document
    .getElementById("createPage")
    .style.display="none";

    document
    .getElementById("homePage")
    .style.display="block";


    window.scrollTo(0,0);

}


/* ==================================================
   HOME
================================================== */

function goHome(){

    document
    .getElementById("socialPage")
    .style.display="none";

    document
    .getElementById("createPage")
    .style.display="none";

    document
    .getElementById("homePage")
    .style.display="block";

    window.scrollTo(0,0);

}


/* ==================================================
   SECURITY
================================================== */

function escapeHTML(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==================================================
   STARTUP
================================================== */

window.addEventListener("load",()=>{

    const profile=
    localStorage.getItem("voidProfile");


    /*
       Agar profile pehle se bani hai
       to direct profile page khulega.
    */

    if(profile){

        openSocial();

    }else{

        document
        .getElementById("homePage")
        .style.display="block";

    }

});

</script>
