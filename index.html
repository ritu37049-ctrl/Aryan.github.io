
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aryan | Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #050510;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Background glow */
body::before {
    content: "";
    position: fixed;
    width: 350px;
    height: 350px;
    background: #6a00ff;
    filter: blur(150px);
    opacity: .25;
    top: 10%;
    left: 10%;
    z-index: -1;
}

body::after {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    background: #00eaff;
    filter: blur(150px);
    opacity: .18;
    bottom: 5%;
    right: 5%;
    z-index: -1;
}

/* Navbar */
nav {
    width: 100%;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #00eaff;
    text-shadow: 0 0 15px #00eaff;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

/* Hero */
.hero {
    min-height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
}

.hero h1 {
    font-size: clamp(45px, 10vw, 90px);
    color: white;
    text-shadow:
        0 0 10px #00eaff,
        0 0 30px #6a00ff;
}

.hero p {
    margin: 15px 0 30px;
    color: #bbb;
    font-size: 18px;
}

/* Explore button */
.explore-btn {
    padding: 15px 35px;
    border: 2px solid #00eaff;
    border-radius: 30px;
    background: transparent;
    color: #00eaff;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0,234,255,.5);
    transition: .3s;
}

.explore-btn:hover {
    background: #00eaff;
    color: #050510;
    box-shadow: 0 0 30px #00eaff;
    transform: scale(1.05);
}

/* Upload section */
#uploadSection {
    display: none;
    padding: 50px 20px;
    text-align: center;
}

.upload-box {
    max-width: 500px;
    margin: auto;
    padding: 35px;
    border: 1px solid #00eaff;
    border-radius: 20px;
    background: rgba(255,255,255,.04);
    box-shadow: 0 0 30px rgba(0,234,255,.15);
}

.upload-box h2 {
    color: #00eaff;
    margin-bottom: 15px;
}

.upload-box p {
    color: #aaa;
    margin-bottom: 25px;
}

/* File input */
input[type="file"] {
    display: none;
}

.upload-label {
    display: inline-block;
    padding: 13px 25px;
    border-radius: 25px;
    border: 1px solid #a000ff;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(160,0,255,.5);
    transition: .3s;
}

.upload-label:hover {
    background: #a000ff;
    box-shadow: 0 0 30px #a000ff;
}

/* Image preview */
#preview {
    display: none;
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    margin-top: 25px;
    border-radius: 15px;
    border: 2px solid #00eaff;
    box-shadow: 0 0 25px rgba(0,234,255,.5);
}

/* Back button */
.back-btn {
    margin-top: 25px;
    padding: 10px 22px;
    border: 1px solid #555;
    border-radius: 20px;
    background: transparent;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<nav>
    <div class="logo">ARYAN</div>

    <div>
        <a href="#">HOME</a>
        <a href="#uploadSection">ABOUT</a>
    </div>
</nav>

<section class="hero" id="home">
    <div>
        <h1>ARYAN</h1>

        <p>
            Welcome to my futuristic world.
        </p>

        <button class="explore-btn" onclick="openExplore()">
            EXPLORE MORE
        </button>
    </div>
</section>

<!-- Explore More Section -->
<section id="uploadSection">

    <div class="upload-box">

        <h2>EXPLORE MORE</h2>

        <p>
            Choose an image from your device.
        </p>

        <label for="imageInput" class="upload-label">
            📷 Choose Image
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <img id="preview" alt="Selected Image">

        <br>

        <button class="back-btn" onclick="closeExplore()">
            ← Back
        </button>

    </div>

</section>

<script>

function openExplore() {
    document.getElementById("uploadSection").style.display = "block";

    document.getElementById("uploadSection")
        .scrollIntoView({
            behavior: "smooth"
        });
}

function closeExplore() {
    document.getElementById("uploadSection").style.display = "none";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

document.getElementById("imageInput").addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    const preview = document.getElementById("preview");

    preview.src = URL.createObjectURL(file);

    preview.style.display = "block";
});

</script>

</body>
</html>
