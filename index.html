<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARYAN // PROFILE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:'Orbitron',sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #3b0a63 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #16003b 0%, transparent 35%),
        #030008;
    color:#fff;
    overflow-x:hidden;
}

/* Background grid */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(160,0,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(160,0,255,.08) 1px, transparent 1px);
    background-size:45px 45px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

/* Glow */
.glow{
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    background:#9d00ff;
    filter:blur(130px);
    opacity:.18;
    pointer-events:none;
}

.glow.one{
    top:-100px;
    left:-100px;
}

.glow.two{
    right:-100px;
    bottom:-100px;
}

/* HEADER */
header{
    text-align:center;
    padding:70px 20px 30px;
}

.logo{
    font-size:clamp(42px,10vw,85px);
    font-weight:900;
    letter-spacing:10px;
    color:#fff;
    text-shadow:
        0 0 10px #b000ff,
        0 0 30px #8a00ff,
        0 0 60px #6500ff;
}

.developed{
    margin-top:12px;
    font-size:12px;
    letter-spacing:5px;
    color:#b9a3ff;
}

/* HOME */
.home{
    max-width:850px;
    margin:auto;
    padding:30px 20px 80px;
    text-align:center;
}

.welcome{
    font-size:clamp(20px,5vw,38px);
    margin-bottom:12px;
}

.subtitle{
    color:#9d8aaa;
    font-size:13px;
    letter-spacing:3px;
    margin-bottom:45px;
}

/* BUTTONS */
.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.main-btn{
    position:relative;
    padding:22px 15px;
    border:1px solid #9d00ff;
    border-radius:12px;
    background:rgba(100,0,160,.12);
    color:#fff;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    cursor:pointer;
    transition:.3s;
    box-shadow:
        0 0 15px rgba(157,0,255,.25),
        inset 0 0 15px rgba(157,0,255,.08);
}

.main-btn:hover{
    transform:translateY(-5px);
    background:rgba(157,0,255,.2);
    box-shadow:
        0 0 25px rgba(157,0,255,.6),
        0 0 60px rgba(157,0,255,.2);
}

.main-btn span{
    display:block;
    font-size:24px;
    margin-bottom:8px;
}

/* PANELS */
.panel{
    display:none;
    max-width:850px;
    margin:20px auto 80px;
    padding:20px;
}

.panel.active{
    display:block;
}

.panel-title{
    text-align:center;
    font-size:25px;
    margin-bottom:30px;
    text-shadow:0 0 20px #9d00ff;
}

/* FORM */
.form-box{
    background:rgba(10,0,20,.75);
    border:1px solid rgba(157,0,255,.45);
    border-radius:18px;
    padding:25px;
    box-shadow:0 0 40px rgba(100,0,180,.15);
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    color:#b99bff;
    font-size:10px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    padding:14px;
    border-radius:8px;
    border:1px solid #402052;
    outline:none;
    background:#08020f;
    color:#fff;
    font-family:inherit;
    font-size:12px;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#a600ff;
    box-shadow:0 0 15px rgba(166,0,255,.25);
}

.save-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:9px;
    background:linear-gradient(90deg,#7200ff,#b000ff);
    color:white;
    font-family:inherit;
    font-weight:800;
    letter-spacing:2px;
    cursor:pointer;
    transition:.3s;
}

.save-btn:hover{
    box-shadow:0 0 30px rgba(174,0,255,.6);
    transform:translateY(-2px);
}

/* IMAGE UPLOAD */
.image-preview{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:0 auto 20px;
    border:2px solid #a000ff;
    box-shadow:0 0 30px rgba(160,0,255,.5);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b0314;
    color:#7c688b;
    font-size:11px;
    text-align:center;
}

.image-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* PROFILE CARD */
.profile-card{
    position:relative;
    max-width:550px;
    margin:auto;
    padding:35px 25px;
    border:1px solid #8c00ff;
    border-radius:22px;
    background:
        linear-gradient(145deg,rgba(50,0,80,.8),rgba(5,0,12,.95));
    box-shadow:
        0 0 30px rgba(140,0,255,.3),
        inset 0 0 30px rgba(120,0,255,.05);
    overflow:hidden;
}

.profile-card::before{
    content:"VOID // PROFILE";
    position:absolute;
    top:15px;
    right:18px;
    font-size:7px;
    color:#744a8d;
    letter-spacing:2px;
}

.profile-card::after{
    content:"";
    position:absolute;
    width:200px;
    height:200px;
    background:#8c00ff;
    filter:blur(100px);
    opacity:.15;
    top:-100px;
    left:-100px;
}

.profile-image{
    width:145px;
    height:145px;
    border-radius:50%;
    border:2px solid #a600ff;
    margin:auto;
    overflow:hidden;
    background:#09000f;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#72527d;
    box-shadow:
        0 0 20px #8c00ff,
        0 0 60px rgba(140,0,255,.4);
}

.profile-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    text-align:center;
    margin-top:22px;
    font-size:27px;
    font-weight:800;
}

.profile-username{
    text-align:center;
    color:#a86dff;
    margin-top:7px;
    font-size:11px;
}

.rank{
    width:max-content;
    margin:15px auto;
    padding:7px 15px;
    border:1px solid #a000ff;
    border-radius:30px;
    font-size:9px;
    letter-spacing:2px;
    color:#d5b6ff;
}

.profile-bio{
    text-align:center;
    color:#b4a5bd;
    line-height:1.8;
    font-size:11px;
    margin:20px 0;
}

.skills{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:20px;
}

.skill{
    padding:8px 12px;
    border-radius:20px;
    background:rgba(140,0,255,.1);
    border:1px solid #442052;
    font-size:9px;
    color:#cdaeff;
}

.socials{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:25px;
}

.social{
    text-decoration:none;
    color:white;
    border:1px solid #54206e;
    padding:10px 15px;
    border-radius:8px;
    font-size:9px;
    transition:.3s;
}

.social:hover{
    border-color:#b000ff;
    box-shadow:0 0 15px rgba(176,0,255,.4);
}

/* EDIT BUTTON */
.edit-btn{
    margin-top:25px;
    width:100%;
    padding:13px;
    background:transparent;
    border:1px solid #702099;
    color:#c99aff;
    border-radius:8px;
    font-family:inherit;
    cursor:pointer;
}

.edit-btn:hover{
    background:rgba(130,0,255,.12);
}

/* EMPTY PROFILE */
.empty{
    text-align:center;
    padding:50px 20px;
    color:#8e7798;
    font-size:12px;
    line-height:2;
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px;
    color:#493c50;
    font-size:9px;
    letter-spacing:3px;
}

/* MOBILE */
@media(max-width:600px){
    .buttons{
        grid-template-columns:1fr;
    }

    header{
        padding-top:45px;
    }

    .logo{
        letter-spacing:5px;
    }

    .form-box{
        padding:18px;
    }

    .profile-card{
        padding:30px 18px;
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<header>
    <div class="logo">ARYAN</div>
    <div class="developed">DEVELOPED BY ARYAN</div>
</header>

<!-- HOME -->
<section class="home" id="home">

    <div class="welcome">
        WELCOME TO MY WORLD
    </div>

    <div class="subtitle">
        CREATE • CUSTOMIZE • EXPRESS
    </div>

    <div class="buttons">

        <button class="main-btn" onclick="showCreate()">
            <span>✦</span>
            CREATE YOUR OWN PROFILE
        </button>

        <button class="main-btn" onclick="showProfile()">
            <span>◈</span>
            MY PROFILE
        </button>

    </div>

</section>


<!-- CREATE PROFILE -->
<section class="panel" id="createPanel">

    <h2 class="panel-title">CREATE YOUR PROFILE</h2>

    <div class="form-box">

        <div class="image-preview" id="imagePreview">
            PROFILE<br>PHOTO
        </div>

        <div class="field">
            <label>PROFILE PHOTO</label>
            <input type="file" id="photo" accept="image/*">
        </div>

        <div class="field">
            <label>YOUR NAME</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="field">
            <label>USERNAME</label>
            <input type="text" id="username" placeholder="@username">
        </div>

        <div class="field">
            <label>BIO</label>
            <textarea id="bio" placeholder="Tell something about yourself..."></textarea>
        </div>

        <div class="field">
            <label>SKILLS</label>
            <input type="text" id="skills" placeholder="Gaming, Editing, Coding...">
        </div>

        <div class="field">
            <label>PROFILE STYLE</label>
            <select id="style">
                <option value="purple">PURPLE VOID</option>
                <option value="blue">CYBER BLUE</option>
                <option value="pink">NEON PINK</option>
                <option value="red">DARK RED</option>
            </select>
        </div>

        <div class="field">
            <label>INSTAGRAM</label>
            <input type="text" id="instagram" placeholder="https://instagram.com/">
        </div>

        <div class="field">
            <label>YOUTUBE</label>
            <input type="text" id="youtube" placeholder="https://youtube.com/">
        </div>

        <div class="field">
            <label>DISCORD</label>
            <input type="text" id="discord" placeholder="Your Discord username">
        </div>

        <button class="save-btn" onclick="saveProfile()">
            CREATE PROFILE
        </button>

    </div>

</section>


<!-- MY PROFILE -->
<section class="panel" id="profilePanel">

    <h2 class="panel-title">MY PROFILE</h2>

    <div id="profileContainer"></div>

</section>


<footer>
    VOID//NET — DEVELOPED BY ARYAN
</footer>


<script>

/* =========================================
   PROFILE DATA
========================================= */

let selectedImage = "";


/* =========================================
   IMAGE PREVIEW
========================================= */

document.getElementById("photo").addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        selectedImage = e.target.result;

        document.getElementById("imagePreview").innerHTML =
            `<img src="${selectedImage}" alt="Profile">`;

    };

    reader.readAsDataURL(file);

});


/* =========================================
   SHOW CREATE
========================================= */

function showCreate(){

    document.getElementById("createPanel").classList.add("active");
    document.getElementById("profilePanel").classList.remove("active");

    document.getElementById("createPanel").scrollIntoView({
        behavior:"smooth"
    });

    loadExistingData();
}


/* =========================================
   SHOW PROFILE
========================================= */

function showProfile(){

    document.getElementById("profilePanel").classList.add("active");
    document.getElementById("createPanel").classList.remove("active");

    document.getElementById("profilePanel").scrollIntoView({
        behavior:"smooth"
    });

    displayProfile();
}


/* =========================================
   SAVE PROFILE
========================================= */

function saveProfile(){

    const name =
        document.getElementById("name").value.trim();

    const username =
        document.getElementById("username").value.trim();

    const bio =
        document.getElementById("bio").value.trim();

    const skills =
        document.getElementById("skills").value
        .split(",")
        .map(x => x.trim())
        .filter(x => x !== "");

    const style =
        document.getElementById("style").value;

    const instagram =
        document.getElementById("instagram").value.trim();

    const youtube =
        document.getElementById("youtube").value.trim();

    const discord =
        document.getElementById("discord").value.trim();


    if(!name || !username){

        alert("Please enter your name and username.");

        return;
    }


    const profile = {

        name:name,

        username:username.startsWith("@")
            ? username
            : "@" + username,

        bio:bio,

        skills:skills,

        style:style,

        instagram:instagram,

        youtube:youtube,

        discord:discord,

        image:selectedImage

    };


    localStorage.setItem(
        "aryanProfile",
        JSON.stringify(profile)
    );


    alert("PROFILE CREATED SUCCESSFULLY ⚡");

    displayProfile();

}


/* =========================================
   LOAD EXISTING DATA
========================================= */

function loadExistingData(){

    const saved =
        localStorage.getItem("aryanProfile");

    if(!saved) return;

    const profile = JSON.parse(saved);

    document.getElementById("name").value =
        profile.name || "";

    document.getElementById("username").value =
        profile.username || "";

    document.getElementById("bio").value =
        profile.bio || "";

    document.getElementById("skills").value =
        (profile.skills || []).join(", ");

    document.getElementById("style").value =
        profile.style || "purple";

    document.getElementById("instagram").value =
        profile.instagram || "";

    document.getElementById("youtube").value =
        profile.youtube || "";

    document.getElementById("discord").value =
        profile.discord || "";


    if(profile.image){

        selectedImage = profile.image;

        document.getElementById("imagePreview").innerHTML =
            `<img src="${profile.image}" alt="Profile">`;

    }

}


/* =========================================
   DISPLAY PROFILE
========================================= */

function displayProfile(){

    const saved =
        localStorage.getItem("aryanProfile");

    const container =
        document.getElementById("profileContainer");


    if(!saved){

        container.innerHTML = `
            <div class="form-box empty">
                NO PROFILE FOUND<br><br>
                CREATE YOUR PROFILE FIRST.
                <br><br>
                <button class="save-btn"
                        onclick="showCreate()">
                    CREATE PROFILE
                </button>
            </div>
        `;

        return;
    }


    const profile = JSON.parse(saved);


    let skillsHTML = "";

    if(profile.skills && profile.skills.length){

        skillsHTML = profile.skills
            .map(skill =>
                `<div class="skill">${escapeHTML(skill)}</div>`
            )
            .join("");

    }


    let socialsHTML = "";


    if(profile.instagram){

        socialsHTML += `
            <a class="social"
               href="${safeURL(profile.instagram)}"
               target="_blank">
               INSTAGRAM
            </a>
        `;

    }


    if(profile.youtube){

        socialsHTML += `
            <a class="social"
               href="${safeURL(profile.youtube)}"
               target="_blank">
               YOUTUBE
            </a>
        `;

    }


    if(profile.discord){

        socialsHTML += `
            <div class="social">
                DISCORD: ${escapeHTML(profile.discord)}
            </div>
        `;

    }


    const imageHTML = profile.image

        ? `<img src="${profile.image}" alt="Profile Photo">`

        : `<span>NO PHOTO</span>`;


    container.innerHTML = `

        <div class="profile-card">

            <div class="profile-image">
                ${imageHTML}
            </div>

            <div class="profile-name">
                ${escapeHTML(profile.name)}
            </div>

            <div class="profile-username">
                ${escapeHTML(profile.username)}
            </div>

            <div class="rank">
                USER
            </div>

            <div class="profile-bio">
                ${escapeHTML(profile.bio || "No bio added yet.")}
            </div>

            <div class="skills">
                ${skillsHTML}
            </div>

            <div class="socials">
                ${socialsHTML}
            </div>

            <button class="edit-btn"
                    onclick="showCreate()">
                EDIT PROFILE
            </button>

        </div>

    `;

}


/* =========================================
   SECURITY HELPERS
========================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function safeURL(url){

    if(!/^https?:\/\//i.test(url)){
        return "#";
    }

    return url.replace(/"/g,"%22");

}


/* =========================================
   AUTO LOAD
========================================= */

window.addEventListener("load", function(){

    const saved =
        localStorage.getItem("aryanProfile");

    if(saved){

        displayProfile();

    }

});

</script>

</body>
</html>
