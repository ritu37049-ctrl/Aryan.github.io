<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://pqwcbzcqizvhpmgssgjb.supabase.co";

/*
  IMPORTANT:
  Replace YOUR_PUBLISHABLE_KEY with your complete
  Supabase Publishable Key.
*/

const SUPABASE_KEY =
"YOUR_PUBLISHABLE_KEY";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;
let currentProfile = null;
let loginMode = false;


/* =====================================================
   AUTH SCREEN
===================================================== */

function showAuth(mode){

  document.getElementById("landing")
    .classList.add("hidden");

  document.getElementById("authPage")
    .classList.remove("hidden");

  loginMode = mode === "login";

  updateAuthUI();
}


function updateAuthUI(){

  const title =
    document.getElementById("authTitle");

  const button =
    document.getElementById("authButton");

  const fields =
    document.getElementById("signupFields");

  const switchText =
    document.getElementById("switchText");

  if(loginMode){

    title.innerText = "LOGIN";

    button.innerText = "LOGIN";

    fields.classList.add("hidden");

    switchText.innerText =
      "Don't have an account? Create one";

  }else{

    title.innerText = "CREATE PROFILE";

    button.innerText = "CREATE ACCOUNT";

    fields.classList.remove("hidden");

    switchText.innerText =
      "Already have an account? Login";
  }
}


function toggleAuth(){

  loginMode = !loginMode;

  updateAuthUI();
}


function backHome(){

  document.getElementById("authPage")
    .classList.add("hidden");

  document.getElementById("landing")
    .classList.remove("hidden");
}


/* =====================================================
   SIGNUP / LOGIN
===================================================== */

async function submitAuth(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    alert("Email aur password fill karo.");
    return;
  }

  if(loginMode){

    const { data, error } =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if(error){

      alert(error.message);
      return;
    }

    currentUser = data.user;

    await startApp();

  }else{

    const displayName =
      document.getElementById("displayName")
      .value.trim();

    const username =
      document.getElementById("username")
      .value.trim()
      .toLowerCase()
      .replace(/\s+/g,"");

    if(!displayName || !username){

      alert("Name aur username fill karo.");
      return;
    }

    const { data, error } =
      await db.auth.signUp({
        email,
        password
      });

    if(error){

      alert(error.message);
      return;
    }

    if(!data.user){

      alert("Account create nahi hua.");
      return;
    }

    currentUser = data.user;

    const { error: profileError } =
      await db.from("profiles").insert({

        id:data.user.id,

        username:username,

        display_name:displayName,

        bio:"",

        avatar_url:"",

        rank:"USER"
      });

    if(profileError){

      alert(profileError.message);
      return;
    }

    if(!data.session){

      alert(
        "Account create ho gaya! Email verify karke phir Login karo."
      );

      showAuth("login");
      return;
    }

    await startApp();
  }
}


/* =====================================================
   START APP
===================================================== */

async function startApp(){

  document.getElementById("landing")
    .classList.add("hidden");

  document.getElementById("authPage")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  await loadMyProfile();

  await loadFeed();
}


/* =====================================================
   LOAD CURRENT PROFILE
===================================================== */

async function loadMyProfile(){

  if(!currentUser) return;

  const { data, error } =
    await db
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .single();

  if(error){

    console.error(error);
    return;
  }

  currentProfile = data;

  showProfile(data);
}


/* =====================================================
   SHOW PROFILE
===================================================== */

function showProfile(profile){

  if(!profile) return;

  const avatar =
    profile.avatar_url ||
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(profile.display_name);

  document.getElementById("profileSection").innerHTML = `

    <div class="profileCard">

      <div class="profileTop">

        <img
          class="avatar"
          src="${escapeHTML(avatar)}"
        >

        <div class="profileInfo">

          <h2>${escapeHTML(profile.display_name)}</h2>

          <div class="username">
            @${escapeHTML(profile.username)}
          </div>

          <span class="rank">
            ${escapeHTML(profile.rank)}
          </span>

        </div>

      </div>

      <div class="bio">
        ${escapeHTML(profile.bio || "No bio yet.")}
      </div>

      <div class="profileActions">

        <button onclick="openEdit()">
          ✏️ Edit Profile
        </button>

        <button onclick="loadFeed()">
          🔄 Refresh
        </button>

      </div>

    </div>
  `;
}


/* =====================================================
   FEED
===================================================== */

async function loadFeed(){

  const feed =
    document.getElementById("feed");

  feed.innerHTML =
    `<div class="loading">Loading posts...</div>`;

  const { data, error } =
    await db
      .from("posts")
      .select(`
        id,
        user_id,
        image_url,
        caption,
        created_at,
        profiles (
          username,
          display_name,
          avatar_url,
          rank
        )
      `)
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    feed.innerHTML =
      `<div class="empty">Posts load nahi ho rahe.<br>${escapeHTML(error.message)}</div>`;

    return;
  }

  if(!data || data.length === 0){

    feed.innerHTML =
      `<div class="empty">Abhi koi post nahi hai.<br>First post tum karo 🔥</div>`;

    return;
  }

  feed.innerHTML = "";

  for(const post of data){

    await renderPost(post,feed);
  }
}


/* =====================================================
   RENDER POST
===================================================== */

async function renderPost(post,container){

  const profile = post.profiles;

  const avatar =
    profile?.avatar_url ||
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(
      profile?.display_name || "User"
    );

  let liked = false;
  let likeCount = 0;

  const { data:likes } =
    await db
      .from("likes")
      .select("user_id")
      .eq("post_id",post.id);

  if(likes){

    likeCount = likes.length;

    liked =
      !!currentUser &&
      likes.some(
        x => x.user_id === currentUser.id
      );
  }

  const { data:comments } =
    await db
      .from("comments")
      .select(`
        id,
        comment,
        user_id,
        created_at,
        profiles (
          username
        )
      `)
      .eq("post_id",post.id)
      .order("created_at",{ascending:true});

  let commentsHTML = "";

  if(comments && comments.length){

    commentsHTML =
      comments.map(c => `

        <div class="comment">

          <strong>
            @${escapeHTML(
              c.profiles?.username || "user"
            )}
          </strong>

          ${escapeHTML(c.comment)}

        </div>

      `).join("");

  }else{

    commentsHTML =
      `<div class="comment">No comments yet.</div>`;
  }

  const article =
    document.createElement("article");

  article.className = "post";

  article.innerHTML = `

    <div class="postHeader">

      <img
        class="avatar"
        src="${escapeHTML(avatar)}"
      >

      <div>

        <div class="postUser">
          ${escapeHTML(
            profile?.display_name || "User"
          )}
        </div>

        <div class="postRank">
          @${escapeHTML(
            profile?.username || "user"
          )}
          • ${escapeHTML(
            profile?.rank || "USER"
          )}
        </div>

      </div>

    </div>

    <img
      class="postImage"
      src="${escapeHTML(post.image_url)}"
      loading="lazy"
    >

    <div class="postBody">

      <div class="postActions">

        <button
          class="actionBtn ${liked ? "liked":""}"
          onclick="toggleLike(${post.id},this)"
        >
          ${liked ? "♥" : "♡"} ${likeCount}
        </button>

        <button
          class="actionBtn"
          onclick="copyPost('${escapeJS(post.image_url)}')"
        >
          ↗ Share
        </button>

      </div>

      <div class="caption">

        <strong>
          @${escapeHTML(
            profile?.username || "user"
          )}
        </strong>

        ${escapeHTML(post.caption || "")}

      </div>

      <div class="comments">

        ${commentsHTML}

        <div class="commentBox">

          <input
            id="comment-${post.id}"
            placeholder="Write a comment..."
          >

          <button
            onclick="addComment(${post.id})"
          >
            Send
          </button>

        </div>

      </div>

    </div>
  `;

  container.appendChild(article);
}


/* =====================================================
   CREATE POST
===================================================== */

async function createPost(){

  if(!currentUser){

    alert("Pehle login karo.");
    return;
  }

  const file =
    document.getElementById("postImage")
    .files[0];

  const caption =
    document.getElementById("postCaption")
    .value.trim();

  if(!file){

    alert("Post ke liye image select karo.");
    return;
  }

  if(file.size > 10 * 1024 * 1024){

    alert("Image 10MB se chhoti honi chahiye.");
    return;
  }

  const extension =
    file.name.split(".").pop();

  const filePath =
    `${currentUser.id}/posts/${Date.now()}.${extension}`;

  const { error:uploadError } =
    await db.storage
      .from("posts")
      .upload(filePath,file,{
        upsert:false
      });

  if(uploadError){

    alert(uploadError.message);
    return;
  }

  const { data:urlData } =
    db.storage
      .from("posts")
      .getPublicUrl(filePath);

  const imageURL =
    urlData.publicUrl;

  const { error:postError } =
    await db
      .from("posts")
      .insert({

        user_id:currentUser.id,

        image_url:imageURL,

        caption:caption
      });

  if(postError){

    alert(postError.message);
    return;
  }

  document.getElementById("postImage")
    .value = "";

  document.getElementById("postCaption")
    .value = "";

  document.getElementById("imagePreview")
    .style.display = "none";

  alert("🔥 Post uploaded!");

  await loadFeed();
}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function previewImage(event){

  const file =
    event.target.files[0];

  const preview =
    document.getElementById("imagePreview");

  if(!file){

    preview.style.display = "none";
    return;
  }

  preview.src =
    URL.createObjectURL(file);

  preview.style.display = "block";
}


/* =====================================================
   LIKE
===================================================== */

async function toggleLike(postId,button){

  if(!currentUser){

    alert("Login required.");
    return;
  }

  const { data } =
    await db
      .from("likes")
      .select("*")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(data){

    await db
      .from("likes")
      .delete()
      .eq("post_id",postId)
      .eq("user_id",currentUser.id);

  }else{

    await db
      .from("likes")
      .insert({

        post_id:postId,

        user_id:currentUser.id
      });
  }

  await loadFeed();
}


/* =====================================================
   COMMENT
===================================================== */

async function addComment(postId){

  if(!currentUser){

    alert("Login required.");
    return;
  }

  const input =
    document.getElementById(
      "comment-" + postId
    );

  const text =
    input.value.trim();

  if(!text) return;

  const { error } =
    await db
      .from("comments")
      .insert({

        post_id:postId,

        user_id:currentUser.id,

        comment:text
      });

  if(error){

    alert(error.message);
    return;
  }

  input.value = "";

  await loadFeed();
}


/* =====================================================
   EDIT PROFILE
===================================================== */

function openEdit(){

  if(!currentProfile) return;

  document.getElementById("editName")
    .value =
    currentProfile.display_name || "";

  document.getElementById("editBio")
    .value =
    currentProfile.bio || "";

  document.getElementById("editModal")
    .classList.remove("hidden");
}


function closeEdit(){

  document.getElementById("editModal")
    .classList.add("hidden");
}


async function saveProfile(){

  const name =
    document.getElementById("editName")
    .value.trim();

  const bio =
    document.getElementById("editBio")
    .value.trim();

  const file =
    document.getElementById("avatarFile")
    .files[0];

  if(!name){

    alert("Name required.");
    return;
  }

  let avatarURL =
    currentProfile.avatar_url || "";

  if(file){

    const extension =
      file.name.split(".").pop();

    const path =
      `${currentUser.id}/avatars/${Date.now()}.${extension}`;

    const { error:uploadError } =
      await db.storage
        .from("posts")
        .upload(path,file,{
          upsert:false
        });

    if(uploadError){

      alert(uploadError.message);
      return;
    }

    const { data:urlData } =
      db.storage
        .from("posts")
        .getPublicUrl(path);

    avatarURL =
      urlData.publicUrl;
  }

  const { error } =
    await db
      .from("profiles")
      .update({

        display_name:name,

        bio:bio,

        avatar_url:avatarURL

      })
      .eq("id",currentUser.id);

  if(error){

    alert(error.message);
    return;
  }

  closeEdit();

  await loadMyProfile();

  alert("Profile updated!");
}


/* =====================================================
   SEARCH USERS
===================================================== */

let searchTimer;


function searchUsers(){

  clearTimeout(searchTimer);

  searchTimer =
    setTimeout(doSearch,300);
}


async function doSearch(){

  const q =
    document.getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  const result =
    document.getElementById("searchResults");

  if(!q){

    result.innerHTML = "";
    return;
  }

  const { data,error } =
    await db
      .from("profiles")
      .select("*")
      .ilike("username",`%${q}%`)
      .limit(10);

  if(error){

    result.innerHTML = "";
    return;
  }

  result.innerHTML =
    data.map(p => `

      <div
        class="profileCard"
        style="padding:15px"
      >

        <div class="profileTop">

          <img
            class="avatar"
            src="${
              escapeHTML(
                p.avatar_url ||
                "https://ui-avatars.com/api/?name="+
                encodeURIComponent(p.display_name)
              )
            }"
          >

          <div class="profileInfo">

            <h3>
              ${escapeHTML(p.display_name)}
            </h3>

            <div class="username">
              @${escapeHTML(p.username)}
            </div>

            <span class="rank">
              ${escapeHTML(p.rank)}
            </span>

          </div>

        </div>

      </div>

    `).join("");
}

async function logout(){

  currentUser = null;
  currentProfile = null;

  document.getElementById("app")

  document.getElementById("authPage")
    .classList.add("hidden");

/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeJS(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}


/* =====================================================
   CHECK EXISTING LOGIN
===================================================== */

async function checkSession(){

  const { data } =
    await db.auth.getSession();

  if(data.session){

    currentUser =
      data.session.user;

    await startApp();
  }
}


/* =====================================================
   AUTH STATE
===================================================== */

db.auth.onAuthStateChange(
  async (event,session)=>{

    if(session){

      currentUser =
        session.user;

    }
  }
);


/* =====================================================
   START
===================================================== */

checkSession();
